openarm_mtc_environment_check:
  ros__parameters:
    robot:
      arm_group: right_arm
      gripper_group: right_gripper
      eef: right_ee
      ee_frame: openarm_right_ee_base_link
    gripper:
      joint: openarm_right_finger_joint1

openarm_mtc_pregrasp:
  ros__parameters:
    execution:
      # Keep the strict 1 s sensor-header freshness limit below. If planning
      # briefly starves the Python RGB-D detector, wait for a genuinely fresh
      # synchronized frame instead of failing on a millisecond boundary race.
      # A stopped camera/detector still aborts after this bounded interval.
      visual_recheck_wait_timeout: 2.0
    diagnostics:
      # Diagnostic-only tilt scan. Disabled by default: normal runs print only
      # the four formal yaw candidates' raw IK. Set true to also sweep the
      # configured pitch offsets below.
      enable_tilt_scan: false
      # Diagnostic-only scan. It does not relax the actual grasp constraint.
      pitch_offsets_rad: [0.0, -0.08726646259971647, 0.08726646259971647, -0.17453292519943295, 0.17453292519943295, -0.2617993877991494, 0.2617993877991494]
      # After execution, read the joint-trajectory controller state and print
      # the per-joint reference-feedback error (max abs joint error).
      controller_tracking: true
      controller_state_topic: /right_joint_trajectory_controller/controller_state
    robot:
      planning_frame: world
      arm_group: right_arm
      gripper_group: right_gripper
      ee_frame: openarm_right_ee_base_link
      joint_states_topic: /joint_states
      joint_state_wait_timeout: 5.0
    gripper:
      joint: openarm_right_finger_joint1
      open_position: -0.35
      # After release and vertical retreat, stow the empty fingers before the
      # arm returns home instead of carrying the last contact/open angle home.
      post_release_position: 0.0
      # Dynamic aperture model. The one measured reference pair anchors the
      # OpenArm v2.0 angular-finger CAD relation; every runtime target is then
      # computed from the RGB-D measured grasp width.
      reference_joint_position: -0.10
      reference_object_width: 0.040
      # Position-control preload: command this much less aperture than the
      # measured grasp width so contact produces a gentle sustained squeeze.
      # This remains independent of object colour, class and nominal size.
      aperture_preload: 0.002
      # Distance from each finger pivot to the official grasp frame in the CAD.
      finger_contact_radius: 0.070
      # CAD-derived distance from the official grasp frame to the lowest finger
      # collision geometry. Combined with measured object height to keep fingers
      # above the support; this is gripper geometry, not an object-size prior.
      tip_below_grasp_frame: 0.032
      # 3 mm was smaller than the combined RGB-D/TF/tracking/structure error
      # measured on hardware and allowed the fingertips to touch the box. This
      # is enforced above the padded collision top (therefore 13 mm above the
      # raw physical top with the current 5 mm upward-only padding).
      support_clearance: 0.008
      # Include both the actuated finger and the passive mimic finger. The SRDF
      # group alone exposes only the actuated branch as collision geometry.
      touch_links: [openarm_right_ee_link1, openarm_right_ee_link2]
    object:
      id: blue_cube
      pose_topic: /blue_cube/pose
      dimensions_topic: /blue_cube/dimensions
      # Zero means wait until synchronized pose/dimensions arrive. Detection can
      # be slow; planning begins immediately after the first valid pair.
      pose_wait_timeout: 0.0
      max_message_time_delta: 0.20
      # Refuse to execute a plan if perception stopped or the object moved
      # between the planning snapshot and execution.
      max_pose_age: 1.0
      max_motion_xyz: [0.008, 0.008, 0.008]
      max_size_change: [0.008, 0.008, 0.008]
      max_motion_yaw: 0.20
      # This detector is specifically for an object resting on the detected
      # box top. Refuse a stale/mismatched table snapshot instead of planning
      # from mutually inconsistent Z measurements.
      max_support_height_error: 0.015
      # 0 selects symmetry from measured XY aspect: near-square=4, otherwise=2.
      yaw_symmetry_order: 0
      # Must match the RGB-D detector's temporal yaw contract. This is a
      # dimensionless shape test; max_size_change is a freshness threshold and
      # must not be reused to classify square versus rectangular objects.
      square_aspect_ratio_max: 1.30
    tcp:
      # Generated by the current xacro after its v2.0 base-frame shift.  MTC
      # resolves T_ee_tcp from RobotModel; never duplicate the unshifted CAD
      # coordinates here (that caused a yaw-dependent 20.5 mm XY error).
      frame: openarm_right_grasp_frame
    motion:
      # The official grasp frame +X axis is the approach axis. Pitch +90 deg
      # points that axis along world -Z, making the physical gripper vertical.
      pregrasp_offset: 0.07
      # Reverse Cartesian planning may choose a shorter collision-free start
      # when the fixed 70 mm PreGrasp pose is outside the wrist workspace.
      approach_min_distance: 0.04
      lift_min_distance: 0.05
      lift_max_distance: 0.055
      cartesian_step: 0.005
      cartesian_min_fraction: 0.90
      grasp_roll: 0.0
      grasp_pitch: 1.5707963267948966
      # Edge-aligned yaw samples are generated from the detected object's
      # symmetry, then MTC/OMPL rejects candidates with no IK or a collision.
      grasp_yaw_reference: object
      # Keep exact visual edge alignment on hardware. The implementation can
      # accept penalized nonuniform refinements for offline experiments, but
      # +/-5 deg did not recover the randomized boundary failures.
      grasp_yaw_refinements: [0.0]
      max_vertical_tilt_rad: 0.05
      velocity_scaling: 0.30
      acceleration_scaling: 0.30
      planning_timeout: 10.0
      max_solutions: 8
      # The 20 mrad wrist margin is already encoded in MoveIt's planning
      # position bounds. This is now only a post-plan consistency check; adding
      # 0.02 again would double-count the margin.
      joint_limit_margin: 0.0
      margin_joint_names: [openarm_right_joint6, openarm_right_joint7]
    place:
      # Dimensionless fractions of the currently usable detected top area.
      # Actual metres are derived from box size, object size and edge clearance.
      local_xy_fractions: [0.0, 0.0, -0.5, 0.0, 0.5, 0.0, 0.0, -0.5, 0.0, 0.5]
      # Sample wrist rotations relative to the detected box yaw.
      yaw_reference: table
      yaw_candidates: [0.0, 0.5235987755982988, 1.0471975511965976, 1.5707963267948966, 2.0943951023931953, 2.6179938779914944, 3.141592653589793, -2.6179938779914944, -2.0943951023931953, -1.5707963267948966, -1.0471975511965976, -0.5235987755982988]
      preplace_offset: 0.07
      # Lower distance is derived from preplace_offset so the attached object's
      # center reaches the dynamic landing center.
      retreat_distance: 0.07
      edge_clearance: 0.02
      # Release above the measured support instead of applying downward force
      # at a mathematically exact zero-gap landing.
      surface_clearance: 0.005
    table:
      id: table
      pose_topic: /box/pose
      dimensions_topic: /box/dimensions
      # Add padding only above the measured physical top. MTC subtracts this
      # value whenever it computes physical landing height, so it is a robot
      # collision margin rather than a fake change to the perceived box pose.
      collision_padding_xy: 0.0
      collision_padding_top: 0.005
      recheck_before_execute: true
      max_pose_age: 1.0
      max_message_time_delta: 0.20
      max_motion_xyz: [0.008, 0.008, 0.008]
      max_size_change: [0.008, 0.008, 0.008]
      max_motion_yaw: 0.08726646259971647

openarm_mtc_scene_manager:
  ros__parameters:
    scene:
      configured: true
    robot:
      planning_frame: world
    table:
      id: table
      source: vision
      pose_topic: /box/pose
      dimensions_topic: /box/dimensions
      # Zero means wait indefinitely for a stable visual LOCK.
      pose_wait_timeout: 0.0
      max_message_time_delta: 0.2
      # Pose and all three dimensions are consumed exactly as measured. Reject
      # only malformed/non-finite messages, never a hand-entered box range.
      padding_xy: 0.0
      padding_top: 0.005
